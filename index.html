<style>
:root{
  --paper:#EDF0F3; --ink:#111C2E; --ink2:#4A5870; --line:#CBD3DE; --card:#fff;
  --f-body:Vazirmatn,Tahoma,"Segoe UI",sans-serif; --f-display:Lalezar,Vazirmatn,Tahoma,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f-body);line-height:1.8;
  background-color:var(--paper);
  background-image:linear-gradient(rgba(17,28,46,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(17,28,46,.045) 1px,transparent 1px);
  background-size:28px 28px}
.wrap{width:min(1160px,92%);margin-inline:auto}
:focus-visible{outline:3px solid #2A62D9;outline-offset:2px}

/* hero */
.hero{padding:clamp(36px,7vw,84px) 0 22px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(52px,11vw,124px);line-height:1.05;margin:0 0 14px;letter-spacing:-1px}
.lead{max-width:42em;margin:0 0 6px;font-size:clamp(15px,2.2vw,18px);color:var(--ink2)}
.rule{max-width:40em;margin:14px 0 0;padding:12px 16px;border-right:4px solid #E8A317;background:rgba(255,255,255,.7);font-size:14px;color:var(--ink)}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:26px 0 18px}
.search{flex:1 1 280px;max-width:380px}
.search input{width:100%;font:inherit;font-size:15px;padding:12px 16px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink)}
.search input::placeholder{color:#7A879B}
.count{font-size:14px;color:var(--ink2)}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding-bottom:110px}
.tile{--h:#1F4FBF;position:relative;display:flex;flex-direction:column;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:14px 14px 14px;box-shadow:5px 5px 0 var(--ink);min-width:0}
.tile.in{animation:rise .5s both cubic-bezier(.2,.7,.2,1);animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.kind{display:inline-block;padding:1px 9px;border-radius:99px;border:1.5px solid var(--h);color:var(--h);font-weight:500}
.symbol{position:relative;display:grid;place-items:center;height:104px;margin:6px 0 2px;font-family:var(--f-display);font-size:62px;line-height:1;color:var(--h);direction:rtl}
.symbol span{position:relative;z-index:1}
.orbit{position:absolute;inset:6px 18% 6px;border:2px dashed var(--h);border-radius:50%;opacity:0;transform:rotate(-18deg) scaleY(.5)}
.name{margin:0 0 10px;font-size:19px;font-weight:700;text-align:center;line-height:1.5;overflow-wrap:anywhere}
.plays{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 0;min-width:0;display:inline-flex;justify-content:center;align-items:center;text-align:center;font:inherit;font-size:13.5px;font-weight:700;padding:9px 10px;border-radius:9px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.vote{margin-top:8px;width:100%;font:inherit;font-size:13.5px;font-weight:700;padding:9px 10px;border-radius:9px;border:2px dashed var(--h);background:transparent;color:var(--h);cursor:pointer;transition:background .15s,color .15s}
.vote:hover:not(:disabled){background:var(--h);color:#fff;border-style:solid}
.vote:disabled{border-color:var(--line);color:#8A96A8;cursor:not-allowed}
.tile.locked{background:#F6F8FA;border-color:#9AA6B8;box-shadow:5px 5px 0 #CBD3DE}
.tile.locked .symbol,.tile.locked .name{opacity:.55}
.tile.mine{background:var(--ink);color:#fff;box-shadow:5px 5px 0 var(--h)}
.tile.mine .meta{color:#B7C2D6}
.tile.mine .kind{color:#fff;border-color:#fff}
.tile.mine .symbol{color:#FFD36B}
.tile.mine .orbit{opacity:1;border-color:#FFD36B;transform:rotate(-18deg) scaleY(.5);animation:snap .7s cubic-bezier(.2,.8,.2,1) both}
.tile.mine .orbit:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#FFD36B;top:-7px;left:50%;margin-left:-6px;box-shadow:0 0 0 4px rgba(255,211,107,.3)}
@keyframes snap{from{opacity:0;transform:rotate(-198deg) scaleY(.5) scale(.6)}to{opacity:1;transform:rotate(-18deg) scaleY(.5) scale(1)}}
.tile.mine .btn{background:#fff;color:var(--ink);border-color:#fff}
.tile.mine .vote{border:2px solid #FFD36B;background:#FFD36B;color:var(--ink)}
.tile.win{border-color:#E8A317;box-shadow:5px 5px 0 #E8A317}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;background:#E8A317;color:var(--ink);font-weight:700;font-size:12px}
.winner{margin:6px 0 34px;padding:clamp(28px,6vw,64px) clamp(16px,4vw,48px);text-align:center;background:var(--ink);color:#fff;border-radius:18px;border:2px solid var(--ink);box-shadow:8px 8px 0 #E8A317;position:relative;overflow:hidden}
.winner[hidden]{display:none}
.winner .w-top{font-size:clamp(15px,2.6vw,20px);color:#B7C2D6;margin:0 0 6px}
.winner .w-lbl{display:inline-block;margin:0 0 6px;padding:2px 16px;border-radius:99px;background:#E8A317;color:var(--ink);font-weight:700;font-size:clamp(14px,2.4vw,18px)}
.winner .w-name{font-family:var(--f-display);font-weight:400;font-size:clamp(54px,13vw,150px);line-height:1.15;margin:8px 0 4px;color:#FFD36B;overflow-wrap:anywhere;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
.winner .w-sub{margin:10px 0 0;font-size:clamp(14px,2.2vw,17px);color:#B7C2D6}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.winner .dot{position:absolute;left:14px;bottom:14px;background:#fff}
.btn.danger{background:#CF3F2A;border-color:#CF3F2A;color:#fff}
.btn.gold{background:#E8A317;border-color:#E8A317;color:var(--ink)}
.empty{grid-column:1/-1;padding:40px 0;color:var(--ink2)}

/* bottom bar */
.bar{position:fixed;inset-inline:0;bottom:14px;display:flex;justify-content:center;pointer-events:none;z-index:5;padding:0 12px}
.bar>div{pointer-events:auto;display:none;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px 10px 18px;box-shadow:0 10px 30px rgba(17,28,46,.35);font-size:14px}
.bar.show>div{display:flex}
.bar b{color:#FFD36B}
.bar button{font:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:8px;border:2px solid #fff;background:transparent;color:#fff;cursor:pointer}
.bar button:hover{background:#fff;color:var(--ink)}

/* footer */
.foot{border-top:2px solid var(--ink);padding:18px 0 28px;color:var(--ink2);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dot{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:var(--ink);opacity:.14;cursor:pointer}
.dot:hover,.dot:focus-visible{opacity:.6}

/* dialog / toast */
dialog{width:min(460px,92vw);border:2px solid var(--ink);border-radius:14px;padding:22px;background:#fff;color:var(--ink);box-shadow:8px 8px 0 var(--ink);font-family:var(--f-body)}
dialog::backdrop{background:rgba(17,28,46,.55)}
dialog h2{margin:0 0 8px;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.3}
dialog p{margin:0 0 10px;color:var(--ink2);font-size:14.5px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.acts .btn{flex:1 1 auto}
.btn.alt{background:#fff;color:var(--ink)}
.field{display:block;margin:10px 0 0;font-size:13px;color:var(--ink2)}
.field input{display:block;width:100%;margin-top:4px;font:inherit;font-size:15px;padding:10px 12px;border:2px solid var(--ink);border-radius:9px;direction:ltr;text-align:left}
.err{color:#CF3F2A;font-size:13.5px;min-height:1.5em;margin:8px 0 0}
.res{margin:12px 0 0;padding:0;list-style:none;max-height:52vh;overflow:auto}
.res li{margin:0 0 10px}
.res .row{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:500}
.res .trk{height:10px;margin-top:3px;background:#E3E8EE;border-radius:6px;overflow:hidden}
.res .trk i{display:block;height:100%;background:var(--ink);border-radius:6px}
.note{font-size:12.5px;background:#FFF4D6;border:1.5px solid #E8A317;border-radius:8px;padding:6px 10px;color:#5C4200;margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#fff;color:var(--ink);border:2px solid var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;transition:.25s;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:520px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tile{padding:10px;box-shadow:4px 4px 0 var(--ink)}
  .symbol{height:78px;font-size:46px}
  .name{font-size:16px}
  .btn,.vote{font-size:12.5px;padding:8px 6px}
  .meta{font-size:11px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .tile.in,.tile.mine .orbit{animation:none}
  .btn,.toast,.winner .w-name{transition:none;animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>بازی‌های علوم</h1>
    <p class="lead" id="lead">بازی‌های علمی ساخته‌شده توسط دانش‌آموزان را اجرا کن و به بهترین پروژه رأی بده.</p>
    <p class="rule" id="rule">هر نفر فقط یک رأی دارد. رأی بعد از ثبت قفل می‌شود؛ اگر نظرت عوض شد، رأی را پس بگیر و دوباره انتخاب کن.</p>
    <div class="tools" id="tools">
      <label class="search"><input id="search" type="search" placeholder="جست‌وجوی نام دانش‌آموز" aria-label="جست‌وجوی نام دانش‌آموز" autocomplete="off"></label>
      <span class="count" id="count"></span>
    </div>
  </header>
  <main>
  <section class="winner" id="winner" hidden aria-live="polite"></section>
  <section class="grid" id="grid" aria-label="فهرست پروژه‌ها"></section></main>
  <footer class="foot"><span>نمایشگاه پروژه‌های علوم</span><button class="dot" id="adminDot" aria-label="ورود مدیر" title=""></button></footer>
</div>

<div class="bar" id="bar"><div><span>رأی شما برای <b id="barName"></b> ثبت شده است.</span><button id="barRetract">پس گرفتن رأی</button></div></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
/* ===== فهرست پروژه‌ها =====
   kind: web (بازی داخل همین سایت) | link (لینک بیرونی) | pc (فایل دانلودی برای کامپیوتر)
   برای اضافه‌کردن یک نفر، یک خط به همین فهرست اضافه کن (id باید انگلیسی و یکتا باشد)
   و همان id را در جدول projects در Supabase هم اضافه کن. */
const PROJECTS = [

/* اگر true باشد، بعد از پایان نظرسنجی هم فهرست بازی‌ها زیر اعلام برنده دیده می‌شود (فقط دکمه‌های رأی برداشته می‌شوند).
   اگر false باشد، فقط صفحه‌ی برنده نمایش داده می‌شود. */
const SHOW_GAMES_AFTER_END = true;

const CFG = window.APP_CONFIG || {};
const REMOTE = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY);

/* ===== لایه ارتباط با سرور (Supabase) یا حالت آزمایشی ===== */
async function rpc(fn, args){
  const h = {'Content-Type':'application/json', apikey: CFG.SUPABASE_ANON_KEY};
  if (CFG.SUPABASE_ANON_KEY.startsWith('eyJ')) h.Authorization = 'Bearer ' + CFG.SUPABASE_ANON_KEY;
  const r = await fetch(CFG.SUPABASE_URL.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'').replace(/\/+$/,'') + '/rest/v1/rpc/' + fn, {method:'POST', headers:h, body: JSON.stringify(args||{})});
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function localTally(){ try{ return JSON.parse(LS.get('sa_tally')||'{}'); }catch(e){ return {}; } }
const api = REMOTE ? {
  my:      () => rpc('my_vote'),
  cast:    id => rpc('cast_vote', {p_project:id}),
  retract: () => rpc('retract_vote'),
  admin:   (u,p) => rpc('admin_results', {p_user:u, p_pass:p}),
  status:  () => rpc('poll_status'),
  reset:   (u,p) => rpc('admin_reset_votes', {p_user:u, p_pass:p}),
  end:     (u,p) => rpc('admin_end_poll', {p_user:u, p_pass:p}),
  restart: (u,p) => rpc('admin_restart_poll', {p_user:u, p_pass:p})
} : {
  async my(){ return {project: LS.get('sa_vote')}; },
  async cast(id){
    if (localState().ended) return {ok:false, error:'ended'};
    const cur = LS.get('sa_vote');
    if (cur) return {ok:false, error:'already_voted', project:cur};
    const t = localTally(); t[id] = (t[id]||0) + 1; LS.set('sa_tally', JSON.stringify(t)); LS.set('sa_vote', id);
    return {ok:true, project:id};
  },
  async retract(){
    if (localState().ended) return {ok:false, error:'ended'};
    const cur = LS.get('sa_vote');
    if (cur){ const t = localTally(); t[cur] = Math.max(0,(t[cur]||0)-1); LS.set('sa_tally', JSON.stringify(t)); LS.del('sa_vote'); }
    return {ok:true};
  },
  async admin(){ return localResults(); },
  async status(){ const s = localState(); return {ended:!!s.ended, winners:s.winners||[]}; },
  async reset(){ LS.del('sa_tally'); LS.del('sa_vote'); return localResults(); },
  async end(){
    const r = localResults(), top = r.rows.length ? r.rows[0].votes : 0;
    const winners = top > 0 ? r.rows.filter(x=>x.votes===top).map(x=>({id:x.id, name:x.name})) : [];
    LS.set('sa_state', JSON.stringify({ended:true, winners}));
    return localResults();
  },
  async restart(){ LS.del('sa_tally'); LS.del('sa_vote'); LS.del('sa_state'); return localResults(); }
};
function localState(){ try{ return JSON.parse(LS.get('sa_state')||'{}'); }catch(e){ return {}; } }
function localResults(){
  const t = localTally();
  const rows = PROJECTS.map(p => ({id:p.id, name:p.name, votes:t[p.id]||0})).sort((a,b)=>b.votes-a.votes);
  return {ok:true, local:true, ended:!!localState().ended, total: rows.reduce((s,r)=>s+r.votes,0), rows};
}

/* ===== ابزارها ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa = n => Number(n).toLocaleString('fa-IR');
const HUES = ['#1F4FBF','#0B7A6E','#CF3F2A','#5B3AB0','#B87400','#2E7D32'];
let myVote = null, busy = false, firstDraw = true, query = '';
let poll = {ended:false, winners:[]};
const winIds = () => new Set((poll.winners||[]).map(w=>w.id));

let tt;
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('show'),3200); }
function symbolOf(name){ return Array.from(name.replace(/[\s\u200c]/g,'')).slice(0,2).join(''); }
function nameOf(id){ const p = PROJECTS.find(x=>x.id===id); return p ? p.name : ''; }

/* ===== رسم کارت‌ها ===== */
function tileHTML(p, i){
  const ended = poll.ended, isWin = ended && winIds().has(p.id);
  const mine = !ended && myVote === p.id, locked = !ended && !!myVote && !mine;
  const kindLabel = p.kind==='pc' ? 'فقط کامپیوتر' : p.kind==='link' ? 'وب‌سایت' : 'بازی وب';
  let plays;
  if (p.kind==='pc')        plays = `<button class="btn" data-dl="${esc(p.id)}">دانلود برای کامپیوتر</button>`;
  else if (p.kind==='link') plays = `<a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">مشاهده وب‌سایت</a>`;
  else if (p.urls)          plays = p.urls.map(u=>`<a class="btn" href="${esc(u[1])}">${esc(u[0])}</a>`).join('');
  else                      plays = `<a class="btn" href="${esc(p.url)}">اجرای بازی</a>`;
  let vote;
  if (ended)       vote = '';
  else if (mine)        vote = `<button class="vote" data-retract>رأی من ثبت شد · پس گرفتن</button>`;
  else if (locked) vote = `<button class="vote" disabled title="اول رأی قبلی را پس بگیر">رأی قفل است</button>`;
  else             vote = `<button class="vote" data-vote="${esc(p.id)}">رأی به این پروژه</button>`;
  const d = firstDraw ? ` in" style="--h:${HUES[i%HUES.length]};--d:${Math.min(i,14)*40}ms` : `" style="--h:${HUES[i%HUES.length]}`;
  return `<article class="tile${mine?' mine':''}${locked?' locked':''}${isWin?' win':''}${d}">
    <div class="meta"><span class="kind">${kindLabel}</span>${isWin?'<span class="badge">برنده</span>':''}</div>
    <div class="symbol" aria-hidden="true"><i class="orbit"></i><span>${esc(symbolOf(p.name))}</span></div>
    <h2 class="name">${esc(p.name)}</h2>
    <div class="plays">${plays}</div>${vote}</article>`;
}
function draw(){
  const q = query.trim().toLowerCase();
  const list = PROJECTS.map((p,i)=>[p,i]).filter(([p])=>p.name.toLowerCase().includes(q));
  $('count').textContent = fa(PROJECTS.length) + ' پروژه';
  $('grid').innerHTML = list.map(([p,i])=>tileHTML(p,i)).join('') || '<div class="empty">پروژه‌ای با این نام پیدا نشد.</div>';
  firstDraw = false;
  $('bar').classList.toggle('show', !!myVote && !poll.ended);
  if (myVote) $('barName').textContent = nameOf(myVote);
  drawWinner();
}
function drawWinner(){
  const w = $('winner'), ended = poll.ended;
  w.hidden = !ended;
  ['lead','rule'].forEach(id => $(id).hidden = ended);
  const showGames = !ended || SHOW_GAMES_AFTER_END;
  $('tools').hidden = !showGames; $('grid').hidden = !showGames;
  if (!ended){ w.innerHTML = ''; return; }
  const ws = (poll.winners||[]).map(x => nameOf(x.id) || x.name).filter(Boolean);
  const key = ws.join('|');
  if (w.dataset.key === key && w.innerHTML) return;
  w.dataset.key = key;
  let inner;
  if (!ws.length) inner = `<p class="w-top">نظرسنجی بازی‌های علوم به پایان رسید</p><div class="w-name" style="font-size:clamp(34px,8vw,80px)">رأیی ثبت نشد</div>`;
  else inner = `<p class="w-top">نظرسنجی بازی‌های علوم به پایان رسید</p>
    <span class="w-lbl">${ws.length>1?'برنده‌ها (مساوی)':'برنده نظرسنجی'}</span>
    <div class="w-name">${ws.map(esc).join(' و ')}</div>
    <p class="w-sub">تبریک به برنده! از همه‌ی دانش‌آموزان برای ساخت بازی‌ها و رأی‌دادن ممنونیم.</p>`;
  w.innerHTML = inner + '<button class="dot" id="adminDot2" aria-label="ورود مدیر"></button>';
  $('adminDot2').addEventListener('click', openAdmin);
}
async function refreshStatus(){
  try{
    const s = await api.status();
    if (s && typeof s.ended === 'boolean'){
      const was = poll.ended;
      poll = {ended:s.ended, winners:s.winners||[]};
      if (was && !poll.ended){ try{ const r = await api.my(); myVote = (r && r.project) || null; }catch(e){ myVote = null; } }
      draw();
    }
  }catch(e){}
}

/* ===== رأی دادن و پس گرفتن ===== */
const ERR = {ended:'نظرسنجی تمام شده است.', no_ip:'آی‌پی شما تشخیص داده نشد؛ رأی ثبت نشد.', bad_project:'این پروژه در فهرست رأی‌گیری نیست.'};
async function doVote(id){
  if (busy) return; busy = true;
  try{
    const r = await api.cast(id);
    if (r.ok){ myVote = r.project; draw(); toast('رأی شما برای «'+nameOf(id)+'» ثبت شد.'); }
    else if (r.error==='ended'){ await refreshStatus(); toast('نظرسنجی تمام شده است.'); }
    else if (r.error==='already_voted'){ myVote = r.project; draw(); toast('با این اتصال قبلاً رأی داده شده است. اول رأی قبلی را پس بگیر.'); }
    else toast(ERR[r.error] || 'رأی ثبت نشد. دوباره تلاش کن.');
  }catch(e){ toast('ارتباط با سرور برقرار نشد. دوباره تلاش کن.'); }
  busy = false;
}
function askRetract(){
  openDialog(`<h2>رأی را پس می‌گیری؟</h2><p>رأی شما برای «${esc(nameOf(myVote))}» برداشته می‌شود و می‌توانی به پروژه‌ی دیگری رأی بدهی.</p>
    <div class="acts"><button class="btn" id="yes">پس گرفتن رأی</button><button class="btn alt" data-close>نه، بماند</button></div>`,
    d => d.querySelector('#yes').addEventListener('click', async () => {
      if (busy) return; busy = true;
      try{ const r = await api.retract(); if (r.ok){ myVote = null; draw(); toast('رأی شما پس گرفته شد.'); } else { if (r.error==='ended') refreshStatus(); toast(ERR[r.error]||'انجام نشد.'); } }
      catch(e){ toast('ارتباط با سرور برقرار نشد.'); }
      busy = false; d.close();
    }));
}

/* ===== دانلود فایل‌های کامپیوتری ===== */
function startDownload(url){
  const a = document.createElement('a'); a.href = url; a.download = ''; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}
async function pcDownload(p){
  const isExe = /\.exe$/i.test(p.url), isPpt = /\.pptx?$/i.test(p.url);
  const how = isExe
    ? 'بعد از دریافت، فایل را روی کامپیوتر دوبار کلیک کن تا اجرا شود. اگر ویندوز هشدار داد، «More info» و بعد «Run anyway» را بزن.'
    : isPpt
    ? 'این فایل یک ارائه‌ی پاورپوینت است. بعد از دریافت، آن را روی کامپیوتر با PowerPoint باز کن و حالت نمایش اسلاید را اجرا کن.'
    : 'فایل فشرده است. بعد از دریافت، آن را روی کامپیوتر با WinRAR یا 7-Zip باز کن و فایل برنامه را اجرا کن.';
  const what = isPpt ? 'ارائه‌ی پاورپوینت است و باید روی کامپیوتر باز شود' : 'نسخه‌ی ویندوز است و روی گوشی اجرا نمی‌شود';
  let missing = false;
  try{ const r = await fetch(p.url, {method:'HEAD'}); if (r.status===404) missing = true; }catch(e){}
  if (missing){
    openDialog(`<h2>فایل هنوز بارگذاری نشده</h2><p>فایل «${esc(p.name)}» هنوز روی سایت قرار نگرفته است. بعداً دوباره امتحان کن.</p><div class="acts"><button class="btn" data-close>باشه</button></div>`);
    return;
  }
  openDialog(`<h2>این فایل فقط با کامپیوتر باز می‌شود</h2>
    <p>«${esc(p.name)}» ${what}. دانلود همین حالا شروع شد.</p><p>${how}</p>
    <div class="acts"><button class="btn" id="again">دانلود دوباره</button><button class="btn alt" data-close>بستن</button></div>`,
    d => d.querySelector('#again').addEventListener('click', () => startDownload(p.url)));
  startDownload(p.url);
}

/* ===== پنجره‌ها ===== */
const dlg = $('dlg');
function openDialog(html, setup){
  dlg.innerHTML = html;
  dlg.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => dlg.close()));
  if (setup) setup(dlg);
  if (!dlg.open) dlg.showModal();
}
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

/* ===== پنل مدیر ===== */
function resultsHTML(r){
  const max = Math.max(1, ...r.rows.map(x=>x.votes));
  return `<h2>نتایج رأی‌گیری</h2>
    ${r.local ? '<p class="note">حالت آزمایشی: این اعداد فقط مربوط به همین مرورگر است. برای نتایج واقعی، Supabase را وصل کن.</p>' : ''}
    <p>مجموع رأی‌ها: <b>${fa(r.total)}</b></p>
    <ul class="res">${r.rows.map(x=>`<li><div class="row"><span>${esc(x.name)}</span><span>${fa(x.votes)}</span></div><div class="trk"><i style="width:${(x.votes/max*100).toFixed(1)}%"></i></div></li>`).join('')}</ul>
    ${r.ended ? '<p class="note">نظرسنجی پایان یافته و برنده در سایت اعلام شده است.</p>' : ''}
    <div class="acts"><button class="btn" id="refresh">به‌روزرسانی</button>
      ${r.ended
        ? '<button class="btn gold" id="restart">شروع مجدد نظرسنجی</button>'
        : '<button class="btn gold" id="endpoll">پایان نظرسنجی</button><button class="btn danger" id="reset">صفر کردن رأی‌ها</button>'}
      <button class="btn alt" data-close>خروج</button></div>`;
}
const ADMIN_ACTS = {
  reset:   {fn:'reset',   title:'همه‌ی رأی‌ها صفر شود؟', text:'همه‌ی رأی‌های ثبت‌شده پاک می‌شوند و همه می‌توانند دوباره رأی بدهند. این کار برگشت‌پذیر نیست.', go:'بله، صفر شود', done:'همه‌ی رأی‌ها صفر شد.'},
  end:     {fn:'end',     title:'نظرسنجی تمام شود؟', text:'رأی‌گیری بسته می‌شود و نام برنده برای همه‌ی بازدیدکنندگان به‌صورت بزرگ در سایت نمایش داده می‌شود.', go:'بله، پایان نظرسنجی', done:'نظرسنجی تمام شد و برنده اعلام شد.'},
  restart: {fn:'restart', title:'نظرسنجی از نو شروع شود؟', text:'اعلام برنده برداشته می‌شود، همه‌ی رأی‌ها صفر می‌شود و رأی‌گیری دوباره باز می‌شود.', go:'بله، شروع مجدد', done:'نظرسنجی از نو شروع شد.'}
};
function adminAct(key, u, p){
  const a = ADMIN_ACTS[key];
  openDialog(`<h2>${a.title}</h2><p>${a.text}</p>
    <div class="acts"><button class="btn ${key==='reset'?'danger':'gold'}" id="ok">${a.go}</button><button class="btn alt" id="no">انصراف</button></div>`,
    d => {
      d.querySelector('#no').addEventListener('click', async () => { try{ const n = await api.admin(u,p); showResults(n,u,p); }catch(e){ d.close(); } });
      d.querySelector('#ok').addEventListener('click', async () => {
        if (busy) return; busy = true;
        try{
          const n = await api[a.fn](u,p);
          if (n && n.ok){ await refreshStatus(); if (a.fn!=='end') myVote = null; draw(); toast(a.done); showResults(n,u,p); }
          else { toast('انجام نشد؛ نام کاربری یا رمز درست نیست یا دسترسی ندارید.'); d.close(); }
        }catch(e){ toast('ارتباط با سرور برقرار نشد. اگر فایل SQL جدید را اجرا نکرده‌ای، اول آن را اجرا کن.'); d.close(); }
        busy = false;
      });
    });
}
function showResults(r, u, p){
  openDialog(resultsHTML(r), d => {
    d.querySelector('#refresh').addEventListener('click', async () => {
      try{ const n = await api.admin(u,p); if (n.ok) showResults(n,u,p); else d.close(); }catch(e){ toast('ارتباط با سرور برقرار نشد.'); }
    });
    [['reset','reset'],['endpoll','end'],['restart','restart']].forEach(([id,key]) => {
      const b = d.querySelector('#'+id); if (b) b.addEventListener('click', () => adminAct(key,u,p));
    });
  });
}
function openAdmin(){
  if (!REMOTE){ api.admin().then(r => showResults(r)); return; }
  openDialog(`<h2>ورود مدیر</h2>
    <label class="field">نام کاربری<input id="au" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="field">رمز عبور<input id="ap" type="password" autocomplete="off"></label>
    <p class="err" id="ae" role="alert"></p>
    <div class="acts"><button class="btn" id="go">ورود</button><button class="btn alt" data-close>بستن</button></div>`,
    d => {
      const go = async () => {
        const u = d.querySelector('#au').value.trim(), p = d.querySelector('#ap').value;
        const err = d.querySelector('#ae'); err.textContent = '';
        try{
          const r = await api.admin(u,p);
          if (r.ok) showResults(r,u,p); else err.textContent = 'نام کاربری یا رمز عبور درست نیست.';
        }catch(e){ err.textContent = 'ارتباط با سرور برقرار نشد.'; }
      };
      d.querySelector('#go').addEventListener('click', go);
      d.querySelector('#ap').addEventListener('keydown', e => { if (e.key==='Enter') go(); });
    });
}

/* ===== رویدادها ===== */
$('grid').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.vote) doVote(t.dataset.vote);
  else if (t.hasAttribute('data-retract')) askRetract();
  else if (t.dataset.dl) pcDownload(PROJECTS.find(p => p.id === t.dataset.dl));
});
$('barRetract').addEventListener('click', askRetract);
$('search').addEventListener('input', e => { query = e.target.value; draw(); });
$('adminDot').addEventListener('click', openAdmin);

draw();
refreshStatus();
setInterval(refreshStatus, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshStatus(); });
api.my().then(r => { if (r && r.project){ myVote = r.project; draw(); } }).catch(() => toast('اتصال به سرور رأی‌گیری برقرار نشد.'));
</script>
</body>
</html>
