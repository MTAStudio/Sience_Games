<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آزمایشگاه اتمی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#14113a;--panel:#211c57;--ink:#f3f1ff;--dim:#a9a3dd;--hot:#ffd23f;--bad:#ff5a6e;--ok:#3ddc97;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding:10px;max-width:760px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;gap:6px;flex-wrap:wrap;white-space:nowrap}
.top b{color:var(--hot);font-weight:900}
.card{background:var(--panel);border-radius:16px;padding:10px 14px}
.name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name h2{font-size:19px;font-weight:900}
.f{direction:ltr;font-size:26px;font-weight:900;color:var(--hot);letter-spacing:1px}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:36px}
.slot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;border:2px dashed var(--dim);color:var(--dim);direction:ltr}
.slot.on{border-style:solid;color:#14113a;border-color:transparent;transform:scale(1.08)}
.bar{height:6px;border-radius:3px;background:#0003;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ok)}
#stage{flex:1;position:relative;min-height:0;border-radius:16px;overflow:hidden;background:radial-gradient(120% 100% at 50% 100%,#2c2577,#181443)}
canvas{width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;inset:auto 10px 10px;background:#fffc;color:#14113a;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;line-height:1.7;transform:translateY(140%);transition:transform .35s;pointer-events:none}
#toast.top{inset:10px 10px auto;transform:translateY(-140%)}
#toast.show{transform:none}
#bn{position:absolute;inset:26% 10px auto;text-align:center;font-size:28px;font-weight:900;color:var(--hot);text-shadow:0 4px 24px #000a;opacity:0;transform:scale(.6);transition:.35s;pointer-events:none;line-height:1.5}
#bn.show{opacity:1;transform:scale(1)}
#stage.flash{animation:fl .45s}
@keyframes fl{0%{box-shadow:inset 0 0 0 0 #fff0}30%{box-shadow:inset 0 0 70px 10px #3ddc97aa}100%{box-shadow:inset 0 0 0 0 #fff0}}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:20px;background:#14113af2;overflow:auto}
#ov h1{font-size:32px;font-weight:900}
#ov p{color:var(--dim);line-height:1.8;font-size:15px}
#menu{display:grid;gap:10px;width:100%;max-width:380px}
.mode{font:inherit;text-align:right;background:var(--panel);color:var(--ink);border:2px solid #ffffff1f;border-radius:16px;padding:12px 16px;cursor:pointer}
.mode b{display:block;font-size:19px;font-weight:900}
.mode small{color:var(--dim);font-size:13px;line-height:1.7}
.mode:focus-visible,.sm:focus-visible,.c:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sm{font:inherit;font-size:16px;padding:2px 10px;background:#ffffff26;color:var(--ink);border:0;border-radius:10px;cursor:pointer}
#tbl{position:absolute;inset:0;display:grid;grid-template-columns:22px repeat(8,1fr);grid-template-rows:20px repeat(4,1fr);gap:5px;padding:8px;direction:ltr;background:#181443}
.hd{font-size:12px;color:var(--dim);display:grid;place-items:center}
.c{border:0;border-radius:10px;background:var(--panel);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;padding:0;cursor:pointer;min-height:44px}
.c small{font-size:11px;color:var(--dim)}.c b{font-size:21px;font-weight:900}
.c.ok{background:var(--ok);color:#14113a}.c.ok small{color:#14113a}.c.no{background:var(--bad)}
.gap{grid-row:5;grid-column:4/10;display:grid;place-items:center;color:#a9a3dd66;font-size:13px}
.f.cl{direction:rtl;font-size:14px;letter-spacing:0;text-align:left;line-height:1.5}
#bn{white-space:pre-line}
#tbl.nonum .c small{visibility:hidden}
#safe{position:absolute;inset:0;perspective:900px;background:#10131a}
.door{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;background:linear-gradient(135deg,#5b6372,#2b303b 55%,#464d5b);border:6px solid #1a1d25;border-radius:16px;box-shadow:inset 0 0 0 3px #7b8494,inset 0 0 40px #000a;transform-origin:left center;transition:transform .9s cubic-bezier(.6,0,.3,1);backface-visibility:hidden}
#safe.open .door{transform:rotateY(-105deg);pointer-events:none}
.dial{width:96px;height:96px;border-radius:50%;background:repeating-conic-gradient(#e7d28f 0 3deg,#7a6a34 3deg 15deg);border:6px solid #c9a24b;position:relative;transition:transform .5s;box-shadow:0 6px 16px #000a}
.dial::after{content:'';position:absolute;inset:24px;border-radius:50%;background:radial-gradient(#e2e6ee,#7d8594)}
.dial::before{content:'▼';position:absolute;top:-24px;left:0;right:0;text-align:center;color:#ff5a6e;font-size:16px}
#sq{font-weight:900;font-size:19px;text-align:center;line-height:1.7;color:#f4efe0;text-shadow:0 2px 0 #000a;max-width:320px}
#sbtn{display:grid;gap:10px;width:100%;max-width:320px}
.ans{font:inherit;font-weight:900;font-size:17px;background:#1c2029;color:#e7d28f;border:2px solid #c9a24b;border-radius:12px;padding:12px 10px;cursor:pointer}
.ans.good{background:#2f8f5e;color:#fff;border-color:#8ff0b6}.ans.badk{background:#8f2f3d;color:#fff;border-color:#ff9aa8}
.ans:focus-visible,#vgo:focus-visible{outline:3px solid #fff;outline-offset:2px}
.vault{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(#4a3f17,#10131a);text-align:center;padding:20px}
.vault h3{font-size:22px;font-weight:900}
#code{font-size:24px;font-weight:900;color:#ffd23f;line-height:1.9;text-shadow:0 0 18px #ffd23f88}
#help{display:grid;gap:10px;width:100%;max-width:380px;justify-items:center}
#hl{list-style:none;display:grid;gap:8px;width:100%;text-align:right;padding:0}
#hl li{background:var(--panel);border-radius:12px;padding:9px 12px;font-size:14.5px;line-height:1.8;display:flex;gap:10px;align-items:flex-start}
#hl li span{font-size:22px;line-height:1.5}
#hgo{width:100%}
.qrow{display:flex;gap:10px;align-items:stretch;width:100%;max-width:340px}
.tile{min-width:70px;border:3px solid #ffd23f;border-radius:10px;background:#1c2029;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffd23f;padding:4px;box-shadow:0 0 14px #ffd23f44}
.tile small{font-size:12px;align-self:flex-start;color:#a9a3dd}.tile b{font-size:30px;line-height:1.1;font-weight:900}.tile span{font-size:12px;font-weight:700}
.qrow #sq{flex:1;text-align:right;max-width:none;font-size:17px;align-self:center}
.ans{text-align:right}
#dlg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0618ee;padding:14px;overflow:auto;z-index:5}
#dlg .box{width:100%;max-width:400px;display:grid;gap:10px;text-align:center}
#dt{font-size:22px;font-weight:900}#dp{color:#d9d4ff;font-size:14.5px;line-height:1.9}
#dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px}
.nb{font:inherit;background:var(--panel);color:var(--ink);border:2px solid #ffffff22;border-radius:10px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.nb b{font-size:20px}.nb small{font-size:10px;color:var(--dim)}.nb.on{border-color:var(--hot);background:#3a3070}
#dd{font-size:54px;line-height:1.2;letter-spacing:6px}
#db{display:grid;gap:8px}.mode:disabled{opacity:.4;cursor:not-allowed}
#opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{display:flex;gap:6px;align-items:center;border:2px solid;border-radius:10px;padding:3px 8px;font-size:13px;font-weight:700}
.opt b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#14113a;font-size:13px}
.opt.ok{background:#3ddc9755}.opt.cut{opacity:.35;text-decoration:line-through}
#cut{position:absolute;left:10px;bottom:40px;z-index:3}
#hcont{width:100%}
#ov p.cr{font-size:12px;opacity:.7;margin-top:2px}
#rl{position:absolute;right:10px;bottom:10px;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:14px;cursor:pointer;background:#ffffff26;color:var(--ink);border:2px solid #ffffff44}
#rl:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){#toast,#bn{transition:none}#stage.flash{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><span>امتیاز: <b id="sc">۰</b></span><span id="lv"></span><span id="combo"></span><span id="hp"></span><button class="sm" id="mu" aria-label="صدا">🔊</button><button class="sm hide" id="ex" aria-label="خروج به منو">✕ خروج</button></div>
  <div class="card">
    <div class="name"><h2 id="cn">—</h2><span class="f" id="cf"></span></div>
    <div class="slots" id="slots"></div><div id="opts" class="hide"></div>
    <div class="bar"><i id="tm"></i></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="tbl" class="hide"></div>
    <div id="safe" class="hide">
      <div class="vault"><h3>🔓 گاوصندوق باز شد!</h3><small style="color:#a9a3dd">رمز را بخوان؛ چند لحظهٔ دیگر می‌روی سراغ جدول</small><div id="code"></div><button class="mode" id="vgo" style="text-align:center"><b>ورود به جدول</b></button></div>
      <div class="door" id="door"><div class="dial" id="dial"></div><div class="qrow"><div class="tile"><small id="qn">۱</small><b id="qk">؟</b><span id="qy">تستی</span></div><div id="sq"></div></div><div id="sbtn"></div></div>
    </div>
    <div id="toast"></div><div id="bn"></div><button id="rl" class="hide">🔄 خشاب</button>
    <div id="dlg" class="hide"><div class="box"><h3 id="dt"></h3><p id="dp"></p><div id="dg"></div><div id="dd"></div><div id="db"></div></div></div>
    <button id="cut" class="sm hide">✂ حذف گزینه</button>
    <div id="ov">
      <h1 id="h1">⚛ آزمایشگاه اتمی</h1>
      <p id="ovp">یک حالت را انتخاب کن</p>
      <div id="menu">
        <button class="mode" data-m="e"><b>🧪 آسان</b><small>زمان زیاد. هرچه جلوتر بروی زمان کمتر می‌شود و اتم‌ها از نظر رنگ و شکل شبیه هم می‌شوند.</small></button>
        <button class="mode" data-m="m"><b>🏹 متوسط</b><small>کمان‌دار سلولی، یک دقیقه. با تیر اتم‌های درست را بزن؛ هر موج، تیرها قوی‌تر می‌شوند.</small></button>
        <button class="mode" data-m="h"><b>⚡ سخت</b><small>گاوصندوق مندلیف. به سؤال‌های دوگزینه‌ای جواب بده تا رمز خانهٔ عنصر باز شود؛ هر قفل سخت‌تر و کم‌زمان‌تر است.</small></button>
      <button class="mode" data-m="s"><b>🚁 سوپرهیرو</b><small>پنج مرحله، هر مرحله یک دقیقه. با هلیکوپتر و هفت‌تیر به میکروب‌ها شلیک کن، خشاب عوض کن و مولکول بساز.</small></button>
      <button class="mode" data-m="c"><b>🥤 لیوان شانس</b><small>۲۵ مرحله، لیوان‌های تند و جابه‌جاشونده، سؤال علوم و ریسک با تاس. پیشرفتت ذخیره می‌شود.</small></button>
      </div>
      <div id="help" class="hide"><ul id="hl"></ul><button class="mode" id="hgo" style="text-align:center"><b>🚀 شروع</b></button><button class="mode hide" id="hcont" style="text-align:center"><b>▶ ادامه</b></button><button class="sm" id="hback">برگشت به منو</button></div>
      <p id="best"></p>
      <p class="cr">ساختهٔ طراح زادگان</p>
    </div>
  </div>
</div>
<script>
const COL={H:'#9fd3ff',O:'#ff5a4d',C:'#9aa3b2',N:'#5c86ff',Na:'#ffb13b',Cl:'#3ddc97',Mg:'#d38bff'};
const SD={H:6,C:4,N:3,Na:5,Cl:8,Mg:7};
const DEC=['He','Ne','Ca','Cu','Co','Si','Al','S','F','P','K','Li'];
const PW={'★':'#ffd23f','❄':'#7ff3ff','☠':'#8b2fff'};
const SUB='₀₁₂₃₄₅₆₇₈₉';
const sub=n=>n>1?String(n).split('').map(d=>SUB[d]).join(''):'';
const fa=n=>n.toLocaleString('fa-IR');
const $=id=>document.getElementById(id);
const C=[
 ['آب',{H:2,O:1},'هر مولکول آب ۲ اتم هیدروژن و ۱ اتم اکسیژن دارد.'],
 ['کربن دی‌اکسید',{C:1,O:2},'هنگام بازدم، این ترکیب از ریه‌هایمان خارج می‌شود.'],
 ['نمک خوراکی',{Na:1,Cl:1},'از سدیم و کلر ساخته شده است.'],
 ['هیدروژن کلرید',{H:1,Cl:1},'محلول آن در آب، اسید کلریدریک نام دارد.'],
 ['آمونیاک',{N:1,H:3},'در ساخت کودهای شیمیایی کاربرد دارد.'],
 ['متان',{C:1,H:4},'جزء اصلی گاز طبیعی است.'],
 ['منیزیم اکسید',{Mg:1,O:1},'پودر سفیدی که از سوختن نوار منیزیم به دست می‌آید.'],
 ['اکسیژن',{O:2},'مولکولی دو اتمی است، ولی چون یک نوع اتم دارد، عنصر است نه ترکیب.'],
 ['آب اکسیژنه',{H:2,O:2},'هیدروژن پراکسید است؛ اکسیژن بیشتری نسبت به آب دارد.'],
 ['سدیم هیدروکسید',{Na:1,O:1,H:1},'ترکیبی سه‌عنصری که در صابون‌سازی کاربرد دارد.']
];
// نماد، نام، عدد اتمی، دوره، گروه
const EL=[['H','هیدروژن',1,1,1],['He','هلیم',2,1,18],['Li','لیتیم',3,2,1],['Be','برلیم',4,2,2],['B','بور',5,2,13],['C','کربن',6,2,14],['N','نیتروژن',7,2,15],['O','اکسیژن',8,2,16],['F','فلوئور',9,2,17],['Ne','نئون',10,2,18],['Na','سدیم',11,3,1],['Mg','منیزیم',12,3,2],['Al','آلومینیم',13,3,13],['Si','سیلیسیم',14,3,14],['P','فسفر',15,3,15],['S','گوگرد',16,3,16],['Cl','کلر',17,3,17],['Ar','آرگون',18,3,18],['K','پتاسیم',19,4,1],['Ca','کلسیم',20,4,2]];
const GCOL={1:1,2:2,13:3,14:4,15:5,16:6,17:7,18:8};
const STG=[{n:'گرم‌کردن',sp:1,wb:1,bg:['#2c2577','#181443']},{n:'توفان اتمی',sp:1.35,wb:1.9,bg:['#5a1e6e','#1d0f3a']},{n:'تب شیمی',sp:1.7,wb:1.2,bg:['#7a2a1e','#2a0f12']},{n:'سرعت نور',sp:2.1,wb:2.3,bg:['#0f5a63','#071f2e']}];
const PERK=['','تیر آتشین 🔥 و شارژ سریع','تیر نافذ + دوتایی','تیر هدایت‌شونده + سه‌تایی'];
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};

let W,H,dpr,S=null,mode='e',last=0,raf=0,AC=null,mute=false,GEN=0,RESUME=0;
const later=(f,ms)=>{const g=GEN;return window.setTimeout(()=>{if(g===GEN)f()},ms)};
const cv=$('cv'),cx=cv.getContext('2d');
function fit(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',()=>{if(mode!=='h')fit()});
const per=()=>mode==='m'?2:3;
const stIdx=()=>Math.floor(S.done/per());
const stg=()=>{const k=stIdx();return k<4?STG[k]:{...STG[3],sp:STG[3].sp+(k-3)*.2}};

/* ---------- صدا ---------- */
function au(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,ty='sine',v=.15,sl=0,t0=0){if(mute||!AC)return;const t=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
const NT=[523,587,659,784,880,1047];
const sfx={ok(n){tone(NT[Math.max(0,Math.min(n,5))],.18,'triangle',.2,200)},bad(){tone(150,.35,'sawtooth',.2,-90);tone(110,.35,'square',.1,-60)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.2,0,i*.09))},stage(){[392,523,659,784,1047].forEach((f,i)=>tone(f,.3,'square',.1,0,i*.1))},power(){tone(700,.1,'square',.12,500);tone(1200,.2,'square',.1,400,.08)},tick(){tone(900,.05,'square',.07)},over(){[440,370,311,247].forEach((f,i)=>tone(f,.4,'sawtooth',.15,-40,i*.18))},shoot(){tone(240,.14,'triangle',.14,300);tone(1100,.1,'sine',.05,-600)},draw(){tone(180,.05,'square',.03)}};
function banner(t){const b=$('bn');b.textContent=t;b.classList.add('show');later(()=>b.classList.remove('show'),1700)}

/* ---------- ابزار مشترک ---------- */
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*160;S.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6,col})}}
function pop(a,t,c='#fff'){S.fx.push({txt:t,x:a.x,y:a.y,vx:0,vy:-50,l:1,col:c})}
function need(){const r=[];for(const [k,v] of Object.entries(S.order[1]))for(let i=(S.have[k]||0);i<v;i++)r.push(k);return r}
function render(){$('sc').textContent=fa(S.score);
 $('lv').textContent=(mode==='s'||mode==='c')?S.lbl:mode==='h'?'🔐 قفل '+fa(Math.min(S.rd+1,6))+'/۶':(mode==='m'?'موج ':'مرحله ')+fa(stIdx()+1);
 $('hp').textContent=(mode==='c'?'✂ ×'+fa(S.pu||0):mode!=='m'?'❤'.repeat(Math.max(0,S.lives))+'♡'.repeat(Math.max(0,(S.mx||3)-S.lives)):'')+(mode==='m'||mode==='h'?' ⏱ '+fa(Math.max(0,Math.ceil(S.t))):'');
 const c=(mode==='h'||mode==='c')?S.streak:S.combo;$('combo').textContent=c>1?'🔥 ×'+fa(c):''}
function flash(){const st=$('stage');st.classList.remove('flash');void st.offsetWidth;st.classList.add('flash')}
function setBg(g){$('stage').style.background='radial-gradient(120% 100% at 50% 100%,'+g.bg[0]+','+g.bg[1]+')'}

function nextOrder(){
 if(!S.pool.length)S.pool=C.map((_,i)=>i).sort(()=>Math.random()-.5);
 const c=C[S.pool.pop()];S.order=c;S.have={};S.lock=false;
 if(mode==='e'){S.tmax=Math.max(14,40-S.done*2.2);S.t=S.tmax}
 $('cn').textContent=c[0];
 $('cf').textContent=Object.entries(c[1]).map(([k,v])=>k+sub(v)).join('');
 const box=$('slots');box.innerHTML='';

 else if(ph==='lower'){S.pt-=dt;if(S.pt<=0)cShuffleStart()}
 else if(ph==='shuffle'){
  const mv=S.moves[S.mi];
  if(!mv){cPickStart();return}
  S.mt+=dt;const d=S.md*(mv.length>1?1.2:1),t=Math.min(1,S.mt/d),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,arc=S.u*34;
  for(const [a,b] of mv){const A=S.cups[a],B=S.cups[b],pa=S.pos[A.slot],pb=S.pos[B.slot];
   A.x=pa.x+(pb.x-pa.x)*e;A.y=pa.y+(pb.y-pa.y)*e-Math.sin(Math.PI*t)*arc;
   B.x=pb.x+(pa.x-pb.x)*e;B.y=pb.y+(pa.y-pb.y)*e+Math.sin(Math.PI*t)*arc*.5}
  if(t>=1){for(const [a,b] of mv){const A=S.cups[a],B=S.cups[b],s=A.slot;A.slot=B.slot;B.slot=s;for(const c of[A,B]){const p=S.pos[c.slot];c.x=p.x;c.y=p.y}}
   S.mi++;S.mt=0;if(S.mi%3===0)tone(220+rnd(80),.04,'square',.04)}
 }
 else if(ph==='pick'){
  S.pt-=dt;S.pf=Math.max(0,S.pt/S.pk);
  if(S.pt<4&&S.pt>0&&Math.floor(S.pt)!==S.tk){S.tk=Math.floor(S.pt);sfx.tick()}

}
