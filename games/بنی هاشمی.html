      &lt;article class=&quot;info&quot;&gt;&lt;div class=&quot;emoji&quot;&gt;⚪&lt;/div&gt;&lt;h3&gt;نوترون&lt;/h3&gt;&lt;p&gt;در هسته قرار دارد و بار الکتریکی ندارد. با تغییر تعداد نوترون‌ها، ایزوتوپ‌های یک عنصر به‌وجود می‌آیند.&lt;/p&gt;&lt;span class=&quot;pill&quot;&gt;بار: ۰&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;در هسته&lt;/span&gt;&lt;/article&gt;

&lt;button class=&quot;tab&quot; onclick=&quot;tab(&#x27;atom&#x27;,this)&quot;&gt;⚛️ سازنده اتم&lt;/button&gt;
&lt;button class=&quot;tab&quot; onclick=&quot;tab(&#x27;isotope&#x27;,this)&quot;&gt;🧬 ایزوتوپ&lt;/button&gt;
&lt;button class=&quot;tab&quot; onclick=&quot;tab(&#x27;match&#x27;,this)&quot;&gt;🧠 جورکردنی&lt;/button&gt;
&lt;/nav&gt;

&lt;section id=&quot;learn&quot; class=&quot;panel active&quot;&gt;
&lt;h2&gt;📚 نکات مهم درس ۳&lt;/h2&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;اتم&lt;/b&gt;&lt;br&gt;اتم از هسته و الکترون‌ها تشکیل شده است. هسته شامل پروتون و نوترون است.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;پروتون&lt;/b&gt;&lt;br&gt;ذره‌ای با بار الکتریکی &lt;span class=&quot;badge&quot;&gt;مثبت +&lt;/span&gt; است.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;نوترون&lt;/b&gt;&lt;br&gt;ذره‌ای در هسته است که &lt;span class=&quot;badge&quot;&gt;بار ندارد&lt;/span&gt;.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;الکترون&lt;/b&gt;&lt;br&gt;ذره‌ای با بار &lt;span class=&quot;badge&quot;&gt;منفی −&lt;/span&gt; است و پیرامون هسته قرار دارد.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;اتم خنثی&lt;/b&gt;&lt;br&gt;در اتم خنثی، تعداد پروتون‌ها و الکترون‌ها برابر است.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;یون&lt;/b&gt;&lt;br&gt;اگر اتم الکترون از دست بدهد، یون مثبت و اگر الکترون بگیرد، یون منفی تشکیل می‌شود.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;عدد اتمی&lt;/b&gt;&lt;br&gt;عدد اتمی = تعداد پروتون‌های هسته.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;عدد جرمی&lt;/b&gt;&lt;br&gt;عدد جرمی = تعداد پروتون + تعداد نوترون.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;ایزوتوپ&lt;/b&gt;&lt;br&gt;اتم‌های یک عنصر که تعداد پروتون برابر ولی تعداد نوترون متفاوت دارند.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;نمک خوراکی&lt;/b&gt;&lt;br&gt;نمک خوراکی از یون‌های سدیم Na⁺ و کلرید Cl⁻ تشکیل شده است.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;کربن&lt;/b&gt;&lt;br&gt;کربن ایزوتوپ‌هایی مانند کربن-۱۲ و کربن-۱۳ دارد که تعداد نوترون‌های متفاوتی دارند.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;کاربرد ایزوتوپ‌ها&lt;/b&gt;&lt;br&gt;ایزوتوپ‌ها در برخی کاربردهای پزشکی، صنعتی و علمی استفاده می‌شوند.&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;quiz&quot; class=&quot;panel&quot;&gt;
&lt;h2&gt;🎯 مسابقه درس ۳&lt;/h2&gt;
&lt;div id=&quot;quizBox&quot;&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;atom&quot; class=&quot;panel&quot;&gt;
&lt;h2&gt;⚛️ سازنده اتم&lt;/h2&gt;
&lt;p&gt;تعداد پروتون و الکترون را تنظیم کن و نتیجه را ببین.&lt;/p&gt;
&lt;div class=&quot;atombox&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;control&quot;&gt;&lt;label&gt;پروتون: &lt;span id=&quot;pv&quot;&gt;11&lt;/span&gt;&lt;/label&gt;&lt;input id=&quot;p&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;11&quot; oninput=&quot;atom()&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;control&quot;&gt;&lt;label&gt;الکترون: &lt;span id=&quot;ev&quot;&gt;10&lt;/span&gt;&lt;/label&gt;&lt;input id=&quot;e&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;20&quot; value=&quot;10&quot; oninput=&quot;atom()&quot;&gt;&lt;/div&gt;
&lt;div id=&quot;atomText&quot; class=&quot;result&quot;&gt;&lt;/div&gt;
&lt;button class=&quot;btn&quot; onclick=&quot;randomAtom()&quot;&gt;🎲 تصادفی&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;visual&quot; id=&quot;visual&quot;&gt;&lt;div class=&quot;orbit o1&quot;&gt;&lt;/div&gt;&lt;div class=&quot;orbit o2&quot;&gt;&lt;/div&gt;&lt;div class=&quot;nucleus&quot; id=&quot;nuc&quot;&gt;11p&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;isotope&quot; class=&quot;panel&quot;&gt;
&lt;h2&gt;🧬 مأموریت ایزوتوپ&lt;/h2&gt;
&lt;p&gt;از روی عدد اتمی و عدد جرمی، تعداد نوترون را پیدا کن.&lt;/p&gt;
&lt;div id=&quot;iso&quot; class=&quot;result big&quot;&gt;&lt;/div&gt;
&lt;div id=&quot;isoBtns&quot; class=&quot;row&quot; style=&quot;margin-top:12px&quot;&gt;&lt;/div&gt;
&lt;div id=&quot;isoFeed&quot; class=&quot;feedback&quot;&gt;&lt;/div&gt;
&lt;button class=&quot;btn secondary&quot; onclick=&quot;newIso()&quot;&gt;سؤال جدید&lt;/button&gt;
&lt;/section&gt;

&lt;section id=&quot;match&quot; class=&quot;panel&quot;&gt;
&lt;h2&gt;🧠 جورکردنی&lt;/h2&gt;
&lt;p&gt;هر واژه را با تعریف درستش پیدا کن.&lt;/p&gt;
&lt;div id=&quot;matchGame&quot; class=&quot;match&quot;&gt;&lt;/div&gt;
&lt;div id=&quot;matchFeed&quot; class=&quot;feedback&quot;&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;footer&gt;بازی تمرینی درس ۳ علوم هشتم — «از درون اتم چه خبر؟»&lt;/footer&gt;
&lt;/div&gt;

&lt;script&gt;
let score=0,streak=0,qi=0;
function tab(id,el){document.querySelectorAll(&#x27;.panel&#x27;).forEach(x=&gt;x.classList.remove(&#x27;active&#x27;));document.getElementById(id).classList.add(&#x27;active&#x27;);document.querySelectorAll(&#x27;.tab&#x27;).forEach(x=&gt;x.classList.remove(&#x27;active&#x27;));el.classList.add(&#x27;active&#x27;)}
const qs=[
[&quot;کدام ذره بار مثبت دارد؟&quot;,[&quot;الکترون&quot;,&quot;نوترون&quot;,&quot;پروتون&quot;,&quot;یون منفی&quot;],2],
[&quot;کدام ذره بار الکتریکی ندارد؟&quot;,[&quot;پروتون&quot;,&quot;نوترون&quot;,&quot;الکترون&quot;,&quot;یون&quot;],1],
[&quot;عدد اتمی نشان‌دهنده چیست؟&quot;,[&quot;تعداد پروتون&quot;,&quot;تعداد نوترون&quot;,&quot;عدد جرمی&quot;,&quot;تعداد لایه‌ها&quot;],0],
[&quot;عدد جرمی برابر است با…&quot;,[&quot;پروتون − نوترون&quot;,&quot;پروتون + نوترون&quot;,&quot;الکترون + نوترون&quot;,&quot;فقط پروتون&quot;],1],
[&quot;در اتم خنثی تعداد پروتون و الکترون…&quot;,[&quot;متفاوت است&quot;,&quot;برابر است&quot;,&quot;هر دو صفر است&quot;,&quot;همیشه ۲ است&quot;],1],
[&quot;اگر اتم الکترون از دست بدهد، چه یونی تشکیل می‌شود؟&quot;,[&quot;مثبت&quot;,&quot;منفی&quot;,&quot;خنثی&quot;,&quot;ایزوتوپ&quot;],0],
[&quot;اگر اتم الکترون بگیرد، چه یونی تشکیل می‌شود؟&quot;,[&quot;مثبت&quot;,&quot;منفی&quot;,&quot;خنثی&quot;,&quot;هسته&quot;],1],
[&quot;ایزوتوپ‌های یک عنصر چه چیزی را یکسان دارند؟&quot;,[&quot;تعداد پروتون&quot;,&quot;تعداد نوترون&quot;,&quot;عدد جرمی&quot;,&quot;تعداد لایه‌ها&quot;],0],
[&quot;کربن-۱۳ نسبت به کربن-۱۲ چه تفاوتی دارد؟&quot;,[&quot;یک پروتون بیشتر&quot;,&quot;یک نوترون بیشتر&quot;,&quot;یک الکترون بیشتر در اتم خنثی&quot;,&quot;عنصر دیگری است&quot;],1],
[&quot;نمک خوراکی شامل کدام یون‌هاست؟&quot;,[&quot;Na⁺ و Cl⁻&quot;,&quot;H⁺ و O²⁻&quot;,&quot;K⁺ و O²⁻&quot;,&quot;C و O&quot;],0],
[&quot;اگر عدد اتمی 8 و عدد جرمی 16 باشد، تعداد نوترون چند است؟&quot;,[&quot;8&quot;,&quot;16&quot;,&quot;24&quot;,&quot;4&quot;],0],
[&quot;اگر 12 پروتون و 10 الکترون داشته باشیم، بار ذره چیست؟&quot;,[&quot;2−&quot;,&quot;2+&quot;,&quot;خنثی&quot;,&quot;1−&quot;],1]
];
function quiz(){
if(qi&gt;=qs.length){document.getElementById(&#x27;quizBox&#x27;).innerHTML=`&lt;div class=&quot;result&quot;&gt;&lt;div class=&quot;big&quot;&gt;🎉 تمام شد!&lt;/div&gt;&lt;p&gt;امتیاز: ${score}&lt;/p&gt;&lt;button class=&quot;btn&quot; onclick=&quot;qi=0;quiz()&quot;&gt;دوباره&lt;/button&gt;&lt;/div&gt;`;return}
let q=qs[qi];document.getElementById(&#x27;quizBox&#x27;).innerHTML=`&lt;div class=&quot;question&quot;&gt;${qi+1}. ${q[0]}&lt;/div&gt;&lt;div class=&quot;answers&quot;&gt;${q[1].map((a,i)=&gt;`&lt;button class=&quot;answer&quot; onclick=&quot;ans(${i},this)&quot;&gt;${a}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;feedback&quot; id=&quot;qf&quot;&gt;&lt;/div&gt;`;
}
function ans(i,b){
let q=qs[qi],bs=document.querySelectorAll(&#x27;.answer&#x27;);bs.forEach(x=&gt;x.disabled=true);
if(i===q[2]){b.classList.add(&#x27;correct&#x27;);streak++;score+=100+streak*10;document.getElementById(&#x27;qf&#x27;).textContent=&#x27;✅ عالی! درست جواب دادی.&#x27;;document.getElementById(&#x27;qf&#x27;).style.color=&#x27;#16834e&#x27;}
else{b.classList.add(&#x27;wrong&#x27;);bs[q[2]].classList.add(&#x27;correct&#x27;);streak=0;document.getElementById(&#x27;qf&#x27;).textContent=&#x27;❌ پاسخ درست مشخص شد.&#x27;;document.getElementById(&#x27;qf&#x27;).style.color=&#x27;#c23b3b&#x27;}
stats();setTimeout(()=&gt;{qi++;quiz()},850)}
function stats(){scoreEl.textContent=score;streakEl.textContent=streak;levelEl.textContent=Math.floor(score/300)+1}
const scoreEl=document.getElementById(&#x27;score&#x27;),streakEl=document.getElementById(&#x27;streak&#x27;),levelEl=document.getElementById(&#x27;level&#x27;);quiz();

function atom(){
let p=+document.getElementById(&#x27;p&#x27;).value,e=+document.getElementById(&#x27;e&#x27;).value;
document.getElementById(&#x27;pv&#x27;).textContent=p;document.getElementById(&#x27;ev&#x27;).textContent=e;document.getElementById(&#x27;nuc&#x27;).textContent=p+&#x27;p&#x27;;
let c=p-e;let t=c===0?&#x27;اتم خنثی ⚪&#x27;:c&gt;0?&#x27;یون مثبت ➕&#x27;:&#x27;یون منفی ➖&#x27;;
document.getElementById(&#x27;atomText&#x27;).innerHTML=`&lt;b&gt;${t}&lt;/b&gt;&lt;br&gt;پروتون: ${p} | الکترون: ${e}&lt;br&gt;بار خالص: ${c&gt;0?c+&#x27;+&#x27;:c&lt;0?Math.abs(c)+&#x27;−&#x27;:&#x27;0&#x27;}`;
let v=document.getElementById(&#x27;visual&#x27;);v.querySelectorAll(&#x27;.electron&#x27;).forEach(x=&gt;x.remove());
for(let i=0;i&lt;e;i++){let shell=i&lt;2?1:2,idx=shell===1?i:i-2,count=shell===1?2:Math.min(8,e-2),ang=idx/count*Math.PI*2,r=shell===1?65:115;let d=document.createElement(&#x27;i&#x27;);d.className=&#x27;electron&#x27;;d.style.left=`calc(50% + ${Math.cos(ang)*r}px)`;d.style.top=`calc(50% + ${Math.sin(ang)*r}px)`;v.appendChild(d)}
}
function randomAtom(){document.getElementById(&#x27;p&#x27;).value=Math.floor(Math.random()*20)+1;document.getElementById(&#x27;e&#x27;).value=Math.floor(Math.random()*21);atom()}atom();

let iz;
function newIso(){let z=[1,6,7,8,11,12,17][Math.floor(Math.random()*7)];let a=z+Math.floor(Math.random()*5);iz={z,a};let n=a-z;document.getElementById(&#x27;iso&#x27;).innerHTML=`عدد اتمی = ${z} &amp;nbsp; | &amp;nbsp; عدد جرمی = ${a}&lt;br&gt;&lt;small&gt;تعداد نوترون؟&lt;/small&gt;`;let ar=[n,n+1,Math.max(0,n-1),n+2].sort(()=&gt;Math.random()-.5);document.getElementById(&#x27;isoBtns&#x27;).innerHTML=ar.map(x=&gt;`&lt;button class=&quot;btn secondary&quot; onclick=&quot;isoAns(${x})&quot;&gt;${x}&lt;/button&gt;`).join(&#x27;&#x27;);document.getElementById(&#x27;isoFeed&#x27;).textContent=&#x27;&#x27;}
function isoAns(x){let f=document.getElementById(&#x27;isoFeed&#x27;);if(x===iz.a-iz.z){score+=100;streak++;f.textContent=&#x27;✅ درست! نوترون = عدد جرمی − عدد اتمی&#x27;;f.style.color=&#x27;#16834e&#x27;}else{streak=0;f.textContent=&#x27;❌ جواب درست: &#x27;+(iz.a-iz.z);f.style.color=&#x27;#c23b3b&#x27;}stats()}newIso();

const pairs=[[&#x27;پروتون&#x27;,&#x27;بار مثبت&#x27;],[&#x27;نوترون&#x27;,&#x27;بدون بار&#x27;],[&#x27;الکترون&#x27;,&#x27;بار منفی&#x27;],[&#x27;عدد اتمی&#x27;,&#x27;تعداد پروتون&#x27;],[&#x27;عدد جرمی&#x27;,&#x27;پروتون + نوترون&#x27;],[&#x27;ایزوتوپ&#x27;,&#x27;پروتون یکسان، نوترون متفاوت&#x27;]];
let selected=null,done=0;
function match(){
let items=[];pairs.forEach((p,i)=&gt;{items.push({t:p[0],i});items.push({t:p[1],i})});items.sort(()=&gt;Math.random()-.5);
document.getElementById(&#x27;matchGame&#x27;).innerHTML=items.map(x=&gt;`&lt;button onclick=&quot;pick(${x.i},this)&quot;&gt;${x.t}&lt;/button&gt;`).join(&#x27;&#x27;);
}
function pick(i,b){if(selected===null){selected={i,b};b.style.borderColor=&#x27;#5b43d6&#x27;;return}if(selected.i===i &amp;&amp; selected.b!==b){b.style.background=&#x27;#dcf7e7&#x27;;selected.b.style.background=&#x27;#dcf7e7&#x27;;selected.b.disabled=true;b.disabled=true;done++;score+=70;streak++;stats();document.getElementById(&#x27;matchFeed&#x27;).textContent=done===pairs.length?&#x27;🎉 همه را پیدا کردی!&#x27;:&#x27;✅ جفت درست!&#x27;;}else{selected.b.style.borderColor=&#x27;#d84b4b&#x27;;b.style.borderColor=&#x27;#d84b4b&#x27;;streak=0;stats();document.getElementById(&#x27;matchFeed&#x27;).textContent=&#x27;❌ این دو با هم جور نیستند.&#x27;}selected=null}
match();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe></section>
</main>
<footer>برای یادگیری و تمرین علوم هشتم ساخته شده است. این فایل یک صفحهٔ واحد شامل هر دو بازی است.</footer>

 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===btn));
 document.querySelectorAll('.game').forEach(x=>x.classList.toggle('active',x.id===btn.dataset.game));
